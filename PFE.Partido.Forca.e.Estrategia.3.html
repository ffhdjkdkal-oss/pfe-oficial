<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<title>PFE — Partido Força e Estratégia</title>
<style>
:root{--bg:#ffffff;--card:#fafafa;--line:#e3e5ea;--cy:#168a47;--tx:#1a1d24;--mu:#5b6270;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:70px;scroll-behavior:smooth}
body{margin:0;background:radial-gradient(700px 420px at 15% -60px,#e3f6ea,transparent),radial-gradient(700px 420px at 85% -60px,#fff6d6,transparent),radial-gradient(500px 300px at 50% -40px,#fff6d6,transparent),var(--bg);color:var(--tx);font:16px/1.6 "Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
a{color:var(--cy)}
nav{position:sticky;top:0;z-index:5;background:#ffffffe6;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:8px 14px;flex-wrap:wrap}
nav b{display:flex;align-items:center;gap:8px;margin-right:auto;font-size:18px}
nav a.l{color:var(--mu);text-decoration:none;padding:6px 10px;border-radius:8px;font-size:14px;transition:.2s}
nav a.l:hover,nav a.on{color:var(--tx);background:#eaf7ef}
main{max-width:1000px;margin:0 auto;padding:28px 16px}
h1,h2,h3{line-height:1.2;margin:0 0 10px;font-weight:900;letter-spacing:-.5px}h2{font-size:32px}h2::after{content:"";display:block;width:70px;height:6px;border-radius:9px;margin-top:8px;background:linear-gradient(90deg,#168a47,#f2b705,#168a47)}.btn:not(.p):not(.d){--cy:#a67c00}
.hero{text-align:center;padding:40px 0 20px;animation:up .6s}
.hero h1{font-size:clamp(30px,6vw,52px)}.hero .sig{background:linear-gradient(90deg,#168a47,#e0a000,#168a47);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:8px;font-weight:900;font-size:24px}
.hl{display:block;width:100%;height:auto;margin:0 auto -90px;-webkit-mask-image:linear-gradient(to bottom,#000 50%,transparent 97%),linear-gradient(to right,transparent,#000 12%,#000 88%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(to bottom,#000 50%,transparent 97%),linear-gradient(to right,transparent,#000 12%,#000 88%,transparent);mask-composite:intersect}.hero h1,.hero .sig{position:relative}.hero p{color:var(--mu);max-width:620px;margin:12px auto}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.btn{display:inline-block;border:1px solid var(--cy);background:transparent;color:var(--cy);padding:11px 20px;border-radius:12px;font-weight:700;text-decoration:none;cursor:pointer;font-size:15px;transition:.2s;margin:5px}
.btn:hover{background:var(--cy);color:#fff;transform:translateY(-2px);box-shadow:0 6px 20px #168a4744}
.btn.p{background:var(--cy);color:#fff}.btn.p:hover{background:#1fae5f}
.btn.d{border-color:#6b7280;color:#4b5563}.btn.d:hover{background:#4b5563;color:#fff}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin:16px 0}
.card{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--a,var(--cy));border-radius:16px;padding:18px;transition:.25s;animation:up .5s}.grid>.card:nth-child(even){--a:#e0a000}
.card:hover{border-color:var(--a,var(--cy));transform:translateY(-3px);box-shadow:0 8px 22px #0000001a}
.card p{color:var(--mu);margin:6px 0 0;white-space:pre-line}
.num{display:inline-block;color:var(--a,var(--cy));font-weight:800;font-size:13px;letter-spacing:1px;margin-bottom:4px}
.av{width:84px;height:84px;border-radius:50%;border:2px solid var(--cy);background:#eaf7ef center/cover;display:grid;place-items:center;font-size:30px;font-weight:800;color:var(--cy);margin-bottom:10px}
.tag{font-size:12px;font-weight:700;color:var(--a,var(--cy));border:1px solid var(--line);border-radius:99px;padding:2px 10px}
.mu{color:var(--mu)}
input,textarea,select{width:100%;background:#fff;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px;font:inherit;margin:4px 0 10px}
input:focus,textarea:focus,select:focus,.btn:focus-visible,a:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
label{font-size:13px;color:var(--mu)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 0}
footer{border-top:6px solid;border-image:linear-gradient(90deg,#168a47,#f2b705,#168a47) 1;margin-top:40px;padding:26px 16px;text-align:center;color:var(--mu);font-size:14px}
footer .lg{display:flex;justify-content:center;align-items:center;gap:10px;color:var(--tx);font-weight:700;font-size:17px;margin-bottom:8px}
.prev{display:inline-block;margin-top:14px;border:1px dashed var(--cy);color:var(--cy);border-radius:99px;padding:3px 14px;font-size:13px;letter-spacing:2px;text-transform:uppercase}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto}}
.hb{margin:-28px calc(50% - 50vw) 30px;padding:0 0 54px;background:#0b0f17;border-bottom:6px solid;border-image:linear-gradient(90deg,#168a47,#f2b705,#168a47) 1}.hw{position:relative;max-width:860px;margin:0 auto}.hw img{display:block;width:100%;height:auto}.hw::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 min(10vw,100px) min(5vw,50px) #0b0f17;background:linear-gradient(to bottom,transparent 68%,#0b0f17 99%)}.ht{position:relative;padding:0 16px;margin-top:-min(7vw,70px)}.hb h1{color:#fff}.hb p{color:#c9d1de}.hb p b{color:#fff!important}body{overflow-x:hidden}
.pg>h2:first-child{margin:-28px calc(50% - 50vw) 24px;padding:64px 16px 40px;text-align:center;color:#fff;font-size:34px;background:linear-gradient(#0b3d20aa,#0b3d20ee),var(--im) center 25%/cover no-repeat #0b0f17;border-bottom:6px solid;border-image:linear-gradient(90deg,#168a47,#f2b705,#168a47) 1}.pg>h2:first-child::after{margin:12px auto 0}
nav{background:#0b3d20f2}nav b{color:#fff}nav a.l{color:#b8c0cf}nav a.l:hover,nav a.on{color:#fff;background:#145a30}footer{background:#0b3d20;color:#aab3c5}footer .lg{color:#fff}
@media(max-width:700px){nav{flex-wrap:nowrap;overflow-x:auto}nav a.l,nav b{white-space:nowrap}}
.rl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0;color:var(--mu)}.rl .tag{flex:none}
body{font-weight:600}nav a.l{font-weight:700}.btn{font-weight:800}.card p,.mu,.rl,footer{font-weight:600}.tag{font-weight:800}
label{display:block;margin-top:4px}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}.chip{border:2px solid var(--line);background:#fff;color:var(--tx);border-radius:99px;padding:8px 14px;font:inherit;font-size:14px;font-weight:800;cursor:pointer;transition:.2s}.chip:hover{border-color:var(--cy)}.chip.on{background:var(--cy);border-color:var(--cy);color:#fff}.chip:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
nav{flex-wrap:nowrap;overflow:visible;justify-content:space-between}
.bg{width:46px;height:46px;border:1px solid #2f8a54;border-radius:12px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;transition:.2s;padding:0}
.bg:hover{border-color:#f2b705;background:#145a30}.bg:focus-visible{outline:2px solid #f2b705;outline-offset:2px}
.bg span{display:block;width:22px;height:3px;border-radius:3px;background:#fff;transition:.25s}
.bg[aria-expanded=true] span:nth-child(1){transform:translateY(8px) rotate(45deg)}.bg[aria-expanded=true] span:nth-child(2){opacity:0}.bg[aria-expanded=true] span:nth-child(3){transform:translateY(-8px) rotate(-45deg)}
.mn{position:absolute;top:calc(100% + 8px);right:10px;min-width:min(260px,calc(100vw - 20px));background:#0b3d20;border:1px solid #1f6b3a;border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:2px;box-shadow:0 16px 40px #0007;animation:up .25s}
.mn[hidden]{display:none}
.mn a.l{display:block;padding:13px 14px;font-size:16px;font-weight:800;border-radius:10px}
nav{justify-content:flex-start;gap:14px}nav b{margin-right:0}.mn{right:auto;left:10px}
.rls{display:flex;flex-direction:column;align-items:flex-start;gap:7px;margin-top:10px}.mt{display:inline-block;background:#fff;border:1px solid;border-radius:8px;padding:5px 11px;font-weight:800;font-size:14px;line-height:1.35;max-width:100%}

.in{margin:-28px calc(50% - 50vw) 0;padding:34px 16px 0;text-align:center;background:linear-gradient(#fff,#f1f9f4)}
.in .inc{max-width:760px;margin:0 auto;padding-bottom:36px}
.lc{border:4px solid #0f5a2e;border-radius:22px;background:#fff;padding:10px;box-shadow:10px 10px 0 #e0a000;margin:0 10px 38px;animation:up .6s}
.lc img{display:block;width:100%;height:auto;border-radius:14px}
.in .sig{font-size:14px;letter-spacing:3px;margin-bottom:10px}
.in h1{font-size:clamp(30px,8vw,52px);color:#0f5a2e;line-height:1.1;margin:0 0 14px}
.in mark{background:linear-gradient(transparent 62%,#f2b705 62%);color:inherit;padding:0 2px}
.in .ip{color:#3b4a40;font-size:18px;margin:10px auto;max-width:600px}
.in .ip2{color:#5b6270;font-size:15px;margin:0 auto 18px}
.in .btn{margin:6px}.in .btn.o{--cy:#0f5a2e;border-width:2px}
.st{background:#0b3d20;display:flex;justify-content:center;gap:clamp(24px,10vw,120px);padding:24px 16px;margin:0 -16px;text-align:center}
.st b{display:block;color:#f2b705;font-size:40px;font-weight:900;line-height:1}
.st span{color:#fff;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1px}
.in+h2{margin-top:36px}
.bk{max-width:460px;margin:14px auto 0;padding:14px}.bk svg{display:block;width:100%;height:auto}
</style></head><body>

inicio:function(){return '<section class="in"><div class="inc"><div class="lc"><img src="'+IMG+'" alt="Bandeira do Partido da Força e Estratégia com o brasão PFE" width="1000" height="639"></div><div class="sig">PFE · Partido Força e Estratégia</div><h1>Uma comunidade construída pela <mark>união</mark>, organização e força de seus integrantes.</h1><p class="ip">Uma comunidade do Discord voltada à interação, entretenimento, atividades, organização e união entre seus integrantes.</p><p class="ip2">Partido do 17º Presidente do EB do Delta Braddock.</p>'+dc()+'<br><a class="btn o" href="#sobre">CONHECER A COMUNIDADE</a></div><div class="st"><div><b>'+RULES.length+'</b><span>Artigos no regimento</span></div><div><b>'+HIER.length+'</b><span>Seções na hierarquia</span></div></div></section><h2>Liderança</h2><div class="grid">'+D.leaders.map(leaderCard).join('')+'</div><h2>Destaques</h2><div class="grid"><div class="card"><span class="num">01</span><h3>Interação</h3><p>Um espaço para conversar, conhecer pessoas e participar do dia a dia da comunidade.</p></div><div class="card"><span class="num">02</span><h3>Organização</h3><p>Cargos e estrutura definidos, com comunicados oficiais da equipe administrativa.</p></div><div class="card"><span class="num">03</span><h3>Atividades</h3><p>Entretenimento e atividades conduzidas dentro do servidor do Discord.</p></div><div class="card"><span class="num">04</span><h3>Regimento</h3><p>Cinco artigos que garantem respeito e ordem em todos os canais. <a href="#regras">Ler regras</a></p></div></div>'},
sobre:function(){var b=[['Nossa história','A história do PFE é construída pelos seus integrantes. Os marcos oficiais da comunidade são registrados na seção de comunicados.'],['Nossa comunidade','O PFE reúne pessoas no Discord para conversar, jogar e participar de atividades em um ambiente respeitoso.'],['Nossa organização','A comunidade é conduzida por um Comandante e um Subcomandante, com apoio de administração e moderação.'],['Nossos princípios','União, organização, respeito mútuo e sobriedade nos assuntos oficiais.'],['Nossas atividades','Interação, entretenimento e atividades promovidas dentro do servidor. As novidades saem nos comunicados.']];return '<h2>Sobre nós</h2><p class="mu">Conheça a identidade do Partido Força e Estratégia.</p><div class="grid">'+b.map(function(x,i){return '<div class="card"><span class="num">0'+(i+1)+'</span><h3>'+x[0]+'</h3><p>'+x[1]+'</p></div>'}).join('')+'</div>'},
regras:function(){return '<h2>Regimento interno</h2><p class="mu">Leitura obrigatória para todos os membros.</p><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">'+RULES.map(function(r,i){return '<article class="card"><span class="num">ART. '+(i+1)+'º</span><h3>'+r[0]+'</h3><p>'+r[1]+'</p></article>'}).join('')+'</div>'},
hierarquia:function(){return '<h2>Hierarquia</h2><p class="mu">Divisão de cargos, equipes e responsáveis da comunidade.</p><div class="grid">'+HIER.map(function(g){return '<div class="card"><h3>'+esc(g[0])+'</h3><div class="rls">'+g[1].map(function(r){return '<span class="mt" style="color:'+r[2]+';border-color:'+r[2]+'66">@'+(r[0]?esc(r[0])+' ':'')+esc(r[1])+'</span>'}).join('')+'</div></div>'}).join('')+'</div>'},
lideranca:function(){return '<h2>Liderança</h2><p class="mu">Os responsáveis pela comunidade.</p><div class="grid">'+D.leaders.map(leaderCard).join('')+'</div>'},
organizacao:function(){return '<h2>Organização</h2><p class="mu">Estrutura da comunidade.</p><div class="grid">'+Object.keys(D.org).map(function(k){var m=D.org[k];return '<div class="card"><h3>'+esc(k)+'</h3>'+(m.length?m.map(function(n){return '<p style="margin:2px 0">• '+esc(n)+'</p>'}).join(''):'<p>Nenhum integrante cadastrado.</p>')+'</div>'}).join('')+'</div>'},
comunicados:function(){var p=D.posts.slice().sort(function(a,b){return b.t-a.t});return '<h2>Comunicados</h2><p class="mu">Publicações oficiais, das mais recentes às mais antigas.</p>'+(p.length?p.map(function(x){return '<article class="card" style="margin-bottom:14px"><span class="tag">'+esc(x.c)+'</span><h3 style="margin-top:8px">'+esc(x.ti)+'</h3><div class="mu" style="font-size:13px">'+new Date(x.t).toLocaleDateString('pt-BR')+' · por '+esc(x.a)+'</div><p>'+esc(x.d)+'</p></article>'}).join(''):'<div class="card"><p>Nenhum comunicado publicado ainda.</p></div>')},
recrutamento:function(){return '<h2>Recrutamento</h2><p class="mu">Faça parte do PFE.</p><div class="grid"><div class="card"><h3>A comunidade</h3><p>Uma comunidade do Discord feita de interação, entretenimento e organização.</p></div><div class="card"><h3>Vantagens</h3><p>• Participar das atividades\n• Conviver com a comunidade\n• Acompanhar os comunicados oficiais</p></div><div class="card"><h3>Atividades</h3><p>As atividades são divulgadas no servidor e na seção de comunicados.</p></div></div><div class="card" style="text-align:center"><h3>Convite oficial</h3><p><a href="'+esc(D.invite)+'" target="_blank" rel="noopener">'+esc(D.invite)+'</a></p>'+dc()+'<br><button class="btn" onclick="cp()">COPIAR CONVITE</button></div>'},
admin:function(){if(!AUTH)return '<h2>Área administrativa</h2><div class="card" style="max-width:380px"><label for="pw">Senha</label><input id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')login()"><button class="btn p" onclick="login()">ENTRAR</button><p id="er" style="color:#a16207"></p></div>';
var h='<h2>Painel administrativo</h2><button class="btn d" onclick="logout()">SAIR</button>';
h+='<div class="card" style="margin:14px 0"><h3>Novo comunicado</h3><label>Título</label><input id="pt"><label>Categoria</label><input id="pc" value="Aviso"><label>Responsável</label><input id="pa" value="ERROR"><label>Descrição</label><textarea id="pd" rows="4"></textarea><button class="btn p" onclick="addPost()">PUBLICAR</button>'+D.posts.map(function(x,i){return '<div class="row"><span>'+esc(x.ti)+'</span><button class="btn d" onclick="delPost('+i+')">Remover</button></div>'}).join('')+'</div>';
h+='<div class="card" style="margin-bottom:14px"><h3>Integrantes</h3><label>Cargo / grupo</label><div class="chips" role="group" aria-label="Cargo ou grupo">'+Object.keys(D.org).map(function(k,i){var on=SEL?SEL===k:i===0;return '<button type="button" class="chip'+(on?' on':'')+'" aria-pressed="'+on+'" data-k="'+esc(k)+'" onclick="pick(this)">'+esc(k)+'</button>'}).join('')+'</div><label>Nome</label><input id="on"><button class="btn p" onclick="addMem()">ADICIONAR</button><label>Novo cargo</label><input id="nc"><button class="btn" onclick="addGrp()">CRIAR CARGO</button>'+Object.keys(D.org).map(function(k){return D.org[k].map(function(n,i){return '<div class="row"><span>'+esc(n)+' <span class="mu">· '+esc(k)+'</span></span><button class="btn d" onclick="delMem('+JSON.stringify(k).replace(/"/g,'&quot;')+','+i+')">Remover</button></div>'}).join('')}).join('')+'</div>';
h+='<div class="grid">'+D.leaders.map(function(l,i){return '<div class="card"><h3>Editar '+esc(l.r)+'</h3><label>Nome</label><input id="ln'+i+'" value="'+esc(l.n)+'"><label>Descrição</label><textarea id="ld'+i+'" rows="3">'+esc(l.d)+'</textarea><label>Foto</label><input type="file" accept="image/*" onchange="photo('+i+',this)"><button class="btn p" onclick="saveL('+i+')">SALVAR</button></div>'}).join('')+'</div>';
h+='<div class="card" style="margin-top:14px"><h3>Convite e senha</h3><label>Link do convite</label><input id="iv" value="'+esc(D.invite)+'"><label>Nova senha (opcional)</label><input id="np" type="password"><button class="btn p" onclick="saveC()">SALVAR</button></div><p class="mu" style="font-size:13px">Os dados ficam salvos neste navegador. Senha inicial: pfe-admin (troque-a).</p>';return h}};
function render(){var h=(location.hash.slice(1)||'inicio');if(!V[h])h='inicio';
document.getElementById('nav').innerHTML='<button type="button" class="bg" id="bg" aria-label="Abrir menu" aria-expanded="false" aria-controls="mn" onclick="tm()"><span></span><span></span><span></span></button><b>PFE</b><div class="mn" id="mn" hidden>'+PAGES.map(function(p){return '<a class="l'+(p[0]===h?' on':'')+'" href="#'+p[0]+'">'+p[1]+'</a>'}).join('')+'</div>';
document.body.style.setProperty('--im','url('+IMG+')');var ap=document.getElementById('app');ap.className=h==='inicio'?'':'pg';ap.innerHTML=V[h]();window.scrollTo(0,0);
document.getElementById('foot').innerHTML='<div class="lg">Partido Força e Estratégia</div><div>Comandante: '+esc(L('Comandante'))+' · Subcomandante: '+esc(L('Subcomandante'))+'</div><div style="margin:8px 0"><a href="'+esc(D.invite)+'" target="_blank" rel="noopener">Discord</a> · <a href="#regras">Regras</a></div><div>© Todos os direitos reservados à comunidade PFE.</div>'}
function login(){if(document.getElementById('pw').value===D.pw){AUTH=true;try{sessionStorage.setItem('pfeauth','1')}catch(e){}render()}else document.getElementById('er').textContent='Senha incorreta.'}
function logout(){AUTH=false;try{sessionStorage.removeItem('pfeauth')}catch(e){}render()}
function v(i){return document.getElementById(i).value.trim()}
function addPost(){if(!v('pt')||!v('pd'))return;D.posts.push({ti:v('pt'),c:v('pc')||'Aviso',a:v('pa')||'Administração',d:v('pd'),t:Date.now()});save();render()}
function delPost(i){D.posts.splice(i,1);save();render()}
var SEL='';function pick(el){SEL=el.getAttribute('data-k');Array.prototype.forEach.call(el.parentNode.children,function(c){var on=c===el;c.classList.toggle('on',on);c.setAttribute('aria-pressed',on)})}
function addMem(){if(!v('on'))return;var g=SEL&&D.org[SEL]?SEL:Object.keys(D.org)[0];D.org[g].push(v('on'));save();render()}
function delMem(k,i){D.org[k].splice(i,1);save();render()}
function addGrp(){var n=v('nc');if(n&&!D.org[n]){D.org[n]=[];save();render()}}
function saveL(i){D.leaders[i].n=v('ln'+i)||D.leaders[i].n;D.leaders[i].d=v('ld'+i);save();render()}
function photo(i,el){var f=el.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var c=document.createElement('canvas');c.width=c.height=200;var x=c.getContext('2d'),s=Math.min(im.width,im.height);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,200,200);D.leaders[i].ph=c.toDataURL('image/jpeg',.8);save();render()};im.src=r.result};r.readAsDataURL(f)}
function saveC(){if(v('iv'))D.invite=v('iv');if(v('np'))D.pw=v('np');save();render()}
function cp(){try{navigator.clipboard.writeText(D.invite)}catch(e){}}
function tm(f){var m=document.getElementById('mn'),b=document.getElementById('bg');if(!m)return;var o=(typeof f==='boolean')?f:m.hidden;m.hidden=!o;b.setAttribute('aria-expanded',o);b.setAttribute('aria-label',o?'Fechar menu':'Abrir menu')}
document.addEventListener('click',function(e){if(!e.target.closest('nav'))tm(false)});
document.addEventListener('keydown',function(e){if(e.key==='Escape')tm(false)});
window.addEventListener('hashchange',render);render();
</script></body></html>
